name: Build Standalone Debug APK (arm64-v8a)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free up disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android SDK NDK & CMake
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
            ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: sdk-36-ndk27-cmake322-v1

      - name: Install Android SDK components
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Cache Compiled C++ Native Objects (arm64-v8a)
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
            TMessagesProj_Modules/media/build
          key: cxx-arm64-${{ hashFiles('TMessagesProj/jni/CMakeLists.txt', 'TMessagesProj/jni/voip/CMakeLists.txt', 'TMessagesProj/build.gradle') }}
          restore-keys: |
            cxx-arm64-

      - name: Generate local.properties
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          cat <<EOF > local.properties
          sdk.dir=${ANDROID_HOME}
          APP_ID=${APP_ID:-123456}
          APP_HASH=${APP_HASH:-00000000000000000000000000000000}
          EOF

      - name: Build arm64-v8a Standalone Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug \
            -PtargetAbi=arm64-v8a \
            --build-cache \
            --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTelegramTest-arm64-v8a-debug-apk
          path: TMessagesProj_AppStandalone/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
