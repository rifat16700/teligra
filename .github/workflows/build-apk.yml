name: Build Standalone Debug APK (arm64-v8a)

on:
  workflow_dispatch: {}
  push:
    branches:
      - feature/ai-auto-answer

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free up disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android SDK NDK & CMake
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
            ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: sdk-36-ndk27-cmake322-v1

      - name: Install Android SDK components
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Cache Prebuilt Native .so Libraries (arm64-v8a)
        id: cache-so
        uses: actions/cache@v4
        with:
          path: .native-cache/arm64-v8a
          key: prebuilt-so-arm64-${{ hashFiles('TMessagesProj/jni/CMakeLists.txt', 'TMessagesProj/jni/voip/CMakeLists.txt', 'TMessagesProj/build.gradle') }}

      - name: Generate local.properties
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          cat <<EOF > local.properties
          sdk.dir=${ANDROID_HOME}
          APP_ID=${APP_ID:-123456}
          APP_HASH=${APP_HASH:-00000000000000000000000000000000}
          EOF

      - name: Build arm64-v8a Standalone Debug APK (Fast Prebuilt JNI)
        if: steps.cache-so.outputs.cache-hit == 'true'
        run: |
          mkdir -p TMessagesProj/build/prebuiltJniLibs/arm64-v8a
          cp -f .native-cache/arm64-v8a/*.so TMessagesProj/build/prebuiltJniLibs/arm64-v8a/
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug \
            -PtargetAbi=arm64-v8a \
            -PusePrebuiltJni=true \
            --build-cache \
            --no-daemon

      - name: Build arm64-v8a Standalone Debug APK (Full NDK Build)
        if: steps.cache-so.outputs.cache-hit != 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug \
            -PtargetAbi=arm64-v8a \
            --build-cache \
            --no-daemon
          mkdir -p .native-cache/arm64-v8a
          find TMessagesProj/build/intermediates/cxx -type f -name "*.so" -path "*arm64-v8a*" -exec cp -f {} .native-cache/arm64-v8a/ \;
          ls -lh .native-cache/arm64-v8a

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTelegramTest-arm64-v8a-debug-apk
          path: TMessagesProj_AppStandalone/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
